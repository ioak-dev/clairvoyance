services:
  clairvoyance-postgres:
    image: postgres:17
    container_name: clairvoyance-postgres
    restart: always
    ports:
      - "5433:5432"
    env_file:
      - .env.postgres.dev
    volumes:
      - clairvoyance-postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - clairvoyance-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clairvoyance}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  clairvoyance-postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: clairvoyance-postgrest
    restart: always
    ports:
      - "4001:2001"
    env_file:
      - .env.postgrest.dev
    environment:
      PGRST_SERVER_PORT: 2001
      PGRST_DB_SCHEMAS: public
      PGRST_DB_PRE_REQUEST: public.set_authenticated_role
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_POOL: 20
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 10
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:4001
    networks:
      - clairvoyance-network
    depends_on:
      clairvoyance-postgres:
        condition: service_healthy

  clairvoyance-api:
    build:
      context: ../node
      dockerfile: Dockerfile
    container_name: clairvoyance-api
    restart: always
    ports:
      - "3200:3200"
    env_file:
      - .env.node.dev
    environment:
      PORT: "3200"
      DATABASE_URL: postgres://api:helloapi@clairvoyance-postgres:5432/clairvoyance
      CORS_ORIGIN: http://localhost:3201
    networks:
      - clairvoyance-network
    depends_on:
      clairvoyance-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clairvoyance-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3200}
        VITE_POSTGREST_URL: ${VITE_POSTGREST_URL:-http://localhost:4001}
        VITE_POSTGREST_JWT: ${VITE_POSTGREST_JWT:-}
    container_name: clairvoyance-ui
    restart: always
    ports:
      - "3201:80"
    networks:
      - clairvoyance-network
    depends_on:
      clairvoyance-api:
        condition: service_healthy
      clairvoyance-postgrest:
        condition: service_started

volumes:
  clairvoyance-postgres_data:

networks:
  clairvoyance-network:
    name: clairvoyance-network
